<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACKJACK SASKESOR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF3D81">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-1:#0a0713; --felt-2:#170f28; --rail:#241a3d; --rail-2:#2e2050;
    --gold:#ff3d81; --gold-soft:#ff8fb8;
    --ivory:#f1ecdd; --ivory-dim:#c9c2ac;
    --ink:#0f0b1a; --red:#ff5470;
    --win:#2dd4bf; --lose:#ff4d6d; --tie:#ffb020;
    --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%;
    font-family:'Inter',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% -10%, #2a1b52 0%, var(--felt-1) 55%, #050308 100%);
    color:var(--ivory);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px; margin:0 auto; padding:28px 18px 60px;}
  header h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; margin:0 0 4px; color:var(--ivory);}
  header p{margin:0; color:var(--ivory-dim); font-size:14px; line-height:1.5; max-width:38ch;}

  section{
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    border:1px solid rgba(255,61,129,.14);
    border-radius:var(--radius);
    padding:16px 16px 18px;
    margin-bottom:14px;
  }
  .section-title{font-size:13px; color:var(--gold-soft); font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title .n{
    width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,61,129,.5);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold-soft); flex-shrink:0;
  }

  .slots{display:flex; gap:10px; flex-wrap:wrap;}
  .card-slot{
    width:56px; height:78px; border-radius:9px;
    background:linear-gradient(160deg, var(--ivory), #ddd6bf);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:var(--ink);
    cursor:pointer; border:none; padding:0;
    box-shadow:0 3px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35);
  }
  .card-slot.empty{
    background:rgba(255,255,255,.05); color:rgba(255,61,129,.55);
    border:1.5px dashed rgba(255,61,129,.35); box-shadow:none; font-size:22px; font-weight:400;
  }
  .card-slot .suit{font-size:16px; margin-top:1px;}
  .card-slot.red{color:var(--red);}
  .add-btn{
    width:56px; height:78px; border-radius:9px; border:1.5px dashed rgba(255,143,184,.5);
    background:rgba(255,61,129,.08); color:var(--gold-soft); font-size:26px; cursor:pointer;
  }
  .rm-btn{
    width:56px; text-align:center; font-size:11px; color:var(--ivory-dim); background:none; border:none;
    cursor:pointer; padding:4px 0 0; display:block;
  }
  .hand-col{display:flex; flex-direction:column; align-items:center; gap:2px;}

  button.primary{
    width:100%; padding:15px; margin-top:4px; border:none; border-radius:12px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#241a06; font-weight:700; font-size:15px; font-family:'Inter',sans-serif;
    cursor:pointer; box-shadow:0 6px 16px rgba(255,61,129,.4);
  }
  button.ghost{
    width:100%; padding:10px; margin-top:8px; border:1px solid rgba(255,61,129,.3);
    background:transparent; color:var(--ivory-dim); border-radius:10px; font-size:13px; cursor:pointer;
  }

  .results{display:none;}
  .results.show{display:block;}
  .total-line{font-size:13px; color:var(--ivory-dim); margin-bottom:12px;}
  .total-line b{color:var(--ivory); font-weight:600;}

  .action-badge{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;
    text-align:center; padding:18px 10px; border-radius:12px; margin-bottom:12px;
    letter-spacing:.5px;
  }
  .action-badge.HIT{background:rgba(255,77,109,.15); color:var(--lose); border:1.5px solid rgba(255,77,109,.4);}
  .action-badge.STAND{background:rgba(45,212,191,.15); color:var(--win); border:1.5px solid rgba(45,212,191,.4);}
  .action-badge.DOUBLE{background:rgba(255,176,32,.15); color:var(--tie); border:1.5px solid rgba(255,176,32,.4);}
  .action-badge.SPLIT{background:rgba(255,61,129,.15); color:var(--gold-soft); border:1.5px solid rgba(255,61,129,.4);}
  .action-badge.BUST{background:rgba(255,77,109,.2); color:var(--lose); border:1.5px solid rgba(255,77,109,.5);}
  .action-badge.BLACKJACK{background:rgba(45,212,191,.2); color:var(--win); border:1.5px solid rgba(45,212,191,.5);}

  .rec{padding:14px 15px; border-radius:10px; border-left:3px solid var(--gold); background:rgba(255,61,129,.07);}
  .rec p{margin:0; font-size:13.5px; line-height:1.55; color:var(--ivory-dim);}
  .bust-note{font-size:12px; color:var(--ivory-dim); margin-top:10px;}

  .modal-bg{position:fixed; inset:0; background:rgba(4,10,7,.72); display:none; align-items:flex-end; z-index:20;}
  .modal-bg.show{display:flex;}
  .modal{
    width:100%; max-height:78vh; overflow-y:auto; background:var(--felt-2);
    border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
    border-top:1px solid rgba(255,61,129,.25);
  }
  .modal h3{margin:0 0 12px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; color:var(--ivory);}
  .suit-block{margin-bottom:12px;}
  .suit-block .label{font-size:12px; color:var(--ivory-dim); margin-bottom:7px;}
  .rank-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:7px;}
  .rank-btn{
    padding:9px 0; border-radius:7px; border:1px solid rgba(255,61,129,.2);
    background:rgba(255,255,255,.05); color:var(--ivory); font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:14px; cursor:pointer;
  }
  .rank-btn.red{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BLACKJACK SASKESOR</h1>
    <p>Pon tu mano y la carta visible del dealer. Te digo qué jugar según la estrategia básica.</p>
  </header>

  <section>
    <p class="section-title"><span class="n">1</span>Tu mano</p>
    <div class="slots" id="playerSlots"></div>
  </section>

  <section>
    <p class="section-title"><span class="n">2</span>Carta visible del dealer</p>
    <div class="slots" id="dealerSlots"></div>
  </section>

  <button class="primary" id="calcBtn">¿Qué juego?</button>
  <button class="ghost" id="resetBtn">Nueva mano</button>

  <section class="results" id="results">
    <p class="section-title"><span class="n">3</span>Jugada recomendada</p>
    <div class="total-line" id="totalLine"></div>
    <div class="action-badge" id="actionBadge"></div>
    <div class="rec"><p id="recText"></p></div>
    <div class="bust-note" id="bustNote"></div>
  </section>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Elige una carta</h3>
    <div id="rankGrids"></div>
    <button class="ghost" id="modalClose">Cancelar</button>
  </div>
</div>

<script>
const RANKS = [14,13,12,11,10,9,8,7,6,5,4,3,2];
const RANK_LABEL = {14:'A',13:'K',12:'Q',11:'J',10:'10',9:'9',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2'};
const SUITS = [{s:'s',sym:'♠',red:false,name:'Picas'},{s:'h',sym:'♥',red:true,name:'Corazones'},
               {s:'d',sym:'♦',red:true,name:'Diamantes'},{s:'c',sym:'♣',red:false,name:'Tréboles'}];

let player = [null, null];
let dealer = [null];
let activeSlot = null;

function allCards(){ return [...player, ...dealer].filter(Boolean); }
function isUsed(rank, suit){ return allCards().some(c=>c.rank===rank && c.suit===suit); }

const playerBox = document.getElementById('playerSlots');
const dealerBox = document.getElementById('dealerSlots');

function renderAll(){
  playerBox.innerHTML = '';
  player.forEach((c,i)=>{
    const col = document.createElement('div'); col.className='hand-col';
    const btn = document.createElement('button');
    btn.className = 'card-slot' + (c?'':' empty') + (c && SUITS.find(s=>s.s===c.suit).red ? ' red':'');
    btn.innerHTML = c ? `${RANK_LABEL[c.rank]}<span class="suit">${SUITS.find(s=>s.s===c.suit).sym}</span>` : '?';
    btn.addEventListener('click', ()=>openModal('player', i));
    col.appendChild(btn);
    if(player.length>2){
      const rm = document.createElement('button'); rm.className='rm-btn'; rm.textContent='quitar';
      rm.addEventListener('click', ()=>{ player.splice(i,1); renderAll(); });
      col.appendChild(rm);
    }
    playerBox.appendChild(col);
  });
  const addBtn = document.createElement('button');
  addBtn.className='add-btn'; addBtn.textContent='+';
  addBtn.addEventListener('click', ()=>{ player.push(null); renderAll(); });
  playerBox.appendChild(addBtn);

  dealerBox.innerHTML = '';
  dealer.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className = 'card-slot' + (c?'':' empty') + (c && SUITS.find(s=>s.s===c.suit).red ? ' red':'');
    btn.innerHTML = c ? `${RANK_LABEL[c.rank]}<span class="suit">${SUITS.find(s=>s.s===c.suit).sym}</span>` : '?';
    btn.addEventListener('click', ()=>openModal('dealer', i));
    dealerBox.appendChild(btn);
  });
}
renderAll();

function openModal(group, idx){
  activeSlot = {group, idx};
  const box = document.getElementById('rankGrids');
  box.innerHTML = '';
  SUITS.forEach(suit=>{
    const block = document.createElement('div'); block.className='suit-block';
    block.innerHTML = `<div class="label">${suit.sym} ${suit.name}</div>`;
    const grid = document.createElement('div'); grid.className='rank-grid';
    RANKS.forEach(r=>{
      const b = document.createElement('button');
      b.className = 'rank-btn' + (suit.red?' red':'');
      b.textContent = RANK_LABEL[r];
      if(isUsed(r, suit.s)) b.disabled = true;
      b.addEventListener('click', ()=>{
        const arr = activeSlot.group==='player' ? player : dealer;
        arr[activeSlot.idx] = {rank:r, suit:suit.s};
        renderAll();
        closeModal();
      });
      grid.appendChild(b);
    });
    block.appendChild(grid);
    box.appendChild(block);
  });
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); activeSlot=null; }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

document.getElementById('resetBtn').addEventListener('click', ()=>{
  player=[null,null]; dealer=[null];
  renderAll();
  document.getElementById('results').classList.remove('show');
});

function cardValue(rank){ return rank>=11 && rank<=13 ? 10 : (rank===14 ? 11 : rank); }

function handTotal(cards){
  let total=0, aces=0;
  cards.forEach(c=>{ total += cardValue(c.rank); if(c.rank===14) aces++; });
  while(total>21 && aces>0){ total-=10; aces--; }
  const soft = aces>0 && total<=21;
  return {total, soft};
}

function basicStrategy(playerCards, dealerUpRank){
  const dealerVal = cardValue(dealerUpRank);
  const n = playerCards.length;
  const {total, soft} = handTotal(playerCards);
  const isPair = n===2 && playerCards[0].rank===playerCards[1].rank;
  const pairValue = isPair ? cardValue(playerCards[0].rank) : null;
  const canDouble = n===2;

  if(total>21) return {action:'BUST', reason:'Esta mano ya se pasó de 21.'};
  if(total===21 && n===2) return {action:'BLACKJACK', reason:'¡Blackjack natural! Gana automático salvo que el dealer también tenga 21.'};

  if(isPair){
    if(pairValue===11) return {action:'SPLIT', reason:'Divide siempre los Ases: cada uno puede formar una mano fuerte por separado.'};
    if(pairValue===10) return {action:'STAND', reason:'Nunca dividas dieces — ya tienes 20, una mano muy fuerte tal cual está.'};
    if(pairValue===9){
      if([2,3,4,5,6,8,9].includes(dealerVal)) return {action:'SPLIT', reason:`Divide 9,9 contra dealer ${dealerVal}: mejora tu expectativa frente a esa carta.`};
      return {action:'STAND', reason:'Con 9,9 contra 7, 10 o A, plántate con 18 en vez de dividir.'};
    }
    if(pairValue===8) return {action:'SPLIT', reason:'Divide siempre 8,8: 16 es de las peores manos, mejor separarlas.'};
    if(pairValue===7){
      if(dealerVal<=7) return {action:'SPLIT', reason:`Divide 7,7 contra dealer ${dealerVal}.`};
      return {action:'HIT', reason:`7,7 contra dealer ${dealerVal}: pide carta, dividir no conviene aquí.`};
    }
    if(pairValue===6){
      if(dealerVal<=6) return {action:'SPLIT', reason:`Divide 6,6 contra dealer ${dealerVal}, que tiene buena chance de pasarse.`};
      return {action:'HIT', reason:`6,6 contra dealer ${dealerVal}: pide carta.`};
    }
    if(pairValue===5){
      if(dealerVal<=9) return {action: canDouble?'DOUBLE':'HIT', reason:'Trata el 5,5 como un 10 duro: dobla en vez de dividir.'};
      return {action:'HIT', reason:`5,5 contra dealer ${dealerVal}: pide carta.`};
    }
    if(pairValue===4){
      if(dealerVal===5||dealerVal===6) return {action:'SPLIT', reason:'Divide 4,4 solo contra 5 o 6.'};
      return {action:'HIT', reason:`4,4 contra dealer ${dealerVal}: pide carta, no dividas.`};
    }
    if(pairValue===2 || pairValue===3){
      if(dealerVal<=7) return {action:'SPLIT', reason:`Divide ${pairValue},${pairValue} contra dealer ${dealerVal}.`};
      return {action:'HIT', reason:`${pairValue},${pairValue} contra dealer ${dealerVal}: pide carta.`};
    }
  }

  if(soft){
    if(total<=14){
      if(dealerVal>=5 && dealerVal<=6) return {action: canDouble?'DOUBLE':'HIT', reason:`Mano suave ${total}: dobla contra dealer ${dealerVal}, es su carta más débil.`};
      return {action:'HIT', reason:`Mano suave ${total}: pide carta, aún puedes mejorar sin riesgo de pasarte.`};
    }
    if(total<=16){
      if(dealerVal>=4 && dealerVal<=6) return {action: canDouble?'DOUBLE':'HIT', reason:`Mano suave ${total}: dobla contra dealer ${dealerVal}.`};
      return {action:'HIT', reason:`Mano suave ${total}: pide carta.`};
    }
    if(total===17){
      if(dealerVal>=3 && dealerVal<=6) return {action: canDouble?'DOUBLE':'HIT', reason:'Mano suave 17: dobla contra dealer débil (3-6).'};
      return {action:'HIT', reason:'Mano suave 17: pide carta.'};
    }
    if(total===18){
      if(dealerVal>=3 && dealerVal<=6) return {action: canDouble?'DOUBLE':'STAND', reason:'Mano suave 18: dobla contra dealer débil (3-6).'};
      if(dealerVal===2 || dealerVal===7 || dealerVal===8) return {action:'STAND', reason:'Mano suave 18: plántate, ya es una buena mano.'};
      return {action:'HIT', reason:`Mano suave 18 contra dealer ${dealerVal}: pide carta, esa carta es fuerte.`};
    }
    return {action:'STAND', reason:`Mano suave alta (${total}): plántate, ya es una mano ganadora.`};
  }

  // hard totals
  if(total<=8) return {action:'HIT', reason:`Total ${total}: siempre pide carta, no hay riesgo de pasarte.`};
  if(total===9){
    if(dealerVal>=3 && dealerVal<=6) return {action: canDouble?'DOUBLE':'HIT', reason:'9 duro: dobla contra dealer débil (3-6).'};
    return {action:'HIT', reason:`9 duro contra dealer ${dealerVal}: pide carta.`};
  }
  if(total===10){
    if(dealerVal>=2 && dealerVal<=9) return {action: canDouble?'DOUBLE':'HIT', reason:'10 duro: dobla, es una de tus mejores oportunidades.'};
    return {action:'HIT', reason:`10 duro contra dealer ${dealerVal}: pide carta.`};
  }
  if(total===11){
    if(dealerVal<=10) return {action: canDouble?'DOUBLE':'HIT', reason:'11 duro: dobla casi siempre, gran probabilidad de sacar 20 o 21.'};
    return {action:'HIT', reason:'11 duro contra As: pide carta.'};
  }
  if(total===12){
    if(dealerVal>=4 && dealerVal<=6) return {action:'STAND', reason:`12 duro: plántate, el dealer con ${dealerVal} tiene alta chance de pasarse.`};
    return {action:'HIT', reason:`12 duro contra dealer ${dealerVal}: pide carta, el dealer no está en zona débil.`};
  }
  if(total>=13 && total<=16){
    if(dealerVal<=6) return {action:'STAND', reason:`${total} duro: plántate, el dealer con ${dealerVal} probablemente se pase.`};
    return {action:'HIT', reason:`${total} duro contra dealer ${dealerVal}: pide carta, aunque haya riesgo, quedarte pierde más seguido.`};
  }
  return {action:'STAND', reason:`Total alto (${total}): plántate.`};
}

function bustProbability(playerCards, dealerCards){
  const known = [...playerCards, ...dealerCards];
  let remaining = 52 - known.length;
  const {total} = handTotal(playerCards);
  const need = 22 - total; // smallest card value that would bust
  let bustCards = 0;
  // count unseen cards with value >= need (would push total over 21)
  const rankPool = [];
  RANKS.forEach(r=>{ SUITS.forEach(s=>{ if(!known.some(c=>c.rank===r && c.suit===s.s)) rankPool.push(r); }); });
  rankPool.forEach(r=>{ if(cardValue(r) >= need) bustCards++; });
  return remaining>0 ? (bustCards/remaining*100) : 0;
}

document.getElementById('calcBtn').addEventListener('click', ()=>{
  const p = player.filter(Boolean);
  const d = dealer.filter(Boolean);
  if(p.length<2){ alert('Selecciona al menos tus 2 primeras cartas.'); return; }
  if(d.length<1){ alert('Selecciona la carta visible del dealer.'); return; }

  const {total, soft} = handTotal(p);
  document.getElementById('totalLine').innerHTML = `Tu total: <b>${total}${soft?' (suave)':' (duro)'}</b> · Dealer muestra: <b>${RANK_LABEL[d[0].rank]}</b>`;

  const result = basicStrategy(p, d[0].rank);
  const badge = document.getElementById('actionBadge');
  const labels = {HIT:'PIDE CARTA', STAND:'PLÁNTATE', DOUBLE:'DOBLA', SPLIT:'DIVIDE', BUST:'TE PASASTE', BLACKJACK:'¡BLACKJACK!'};
  badge.className = 'action-badge ' + result.action;
  badge.textContent = labels[result.action] || result.action;
  document.getElementById('recText').textContent = result.reason;

  const bustNote = document.getElementById('bustNote');
  if(result.action==='HIT' || result.action==='DOUBLE'){
    const pct = bustProbability(p, d);
    bustNote.textContent = `Probabilidad aproximada de pasarte si pides una carta: ${pct.toFixed(0)}%.`;
  } else {
    bustNote.textContent = '';
  }

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'nearest'});
});
</script>
</body>
</html>
